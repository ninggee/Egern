name: Sync converted Egern modules

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/module_sources.json'
      - 'tools/sync_converted_modules.mjs'
      - 'tools/validate_converted_modules.py'
      - 'tools/publish_converted_modules.py'
      - 'tools/requirements-sync.txt'
      - '.github/workflows/sync-converted-modules.yml'

permissions:
  contents: read

concurrency:
  group: sync-converted-modules
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install YAML validation dependency
        run: python3 -m pip install --disable-pip-version-check --requirement tools/requirements-sync.txt

      - name: Convert reviewed public sources
        run: node tools/sync_converted_modules.mjs --output "$RUNNER_TEMP/converted-modules"

      - name: Validate generated YAML
        run: python3 tools/validate_converted_modules.py "$RUNNER_TEMP/converted-modules" --normalize

      - name: Test publishing and validation protections
        run: python3 -m unittest discover -s tests -v

      - name: Upload converted modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: converted-modules
          path: ${{ runner.temp }}/converted-modules/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download validated module files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: converted-modules
          path: artifact

      - name: Install YAML validation dependency
        run: python3 -m pip install --disable-pip-version-check --requirement tools/requirements-sync.txt

      - name: Validate downloaded artifacts without fetching upstream
        run: python3 tools/validate_converted_modules.py artifact

      - name: Publish generated files and prune removed sources
        run: python3 tools/publish_converted_modules.py artifact

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- modules/converted
          if git diff --cached --quiet; then
            echo 'No generated module changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync converted modules'
          git push origin HEAD:main
