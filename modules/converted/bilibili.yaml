name: bilibili去广告8.13(>=iOS15)
description: 开屏页广告,推荐页广告,动态(最常访问/推荐话题/列表广告),视频播放页面(up主推荐广告)
dns: {}
scriptings:
  - http_response:
      name: bili-json
      match: '^https:\/\/app\.bilibili\.com\/x\/(v2\/(splash\/(list|show)|feed\/index\?)|resource\/show\/tab\/v2)'
      script_url: 'https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js'
      max_size: 0
      timeout: 60
      body_required: true
  - http_response:
      name: bili-proto
      match: '^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.(viewunite\.v1\.View\/View|dynamic\.v2\.Dynamic\/DynAll)$'
      script_url: 'https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-proto.js'
      max_size: 0
      timeout: 60
      body_required: true
      binary_body: true
mitm:
  hostnames:
    includes:
      - app.bilibili.com
      - grpc.biliapi.net
