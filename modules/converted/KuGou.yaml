  - url_regex:
      match: '^https:\/\/vipssr\.kugou\.com\/static\/js\/async\/flexPayPopup'
      policy: REJECT
  - url_regex:
      match: '^https:\/\/.*\.kugou\.com\/vipssr\/prepay_ios\.html'
      policy: REJECT
  - url_regex:
      match: '^https:\/\/staticssl\.kugou\.com\/common\/js-lib\/vip\/dlg_ctrler_v2\.js$'
      policy: REJECT
  - url_regex:
      match: '^https:\/\/h5\.kugou\.com\/apps\/vipcenter\/_next\/static\/css'
      policy: REJECT
  - url_regex:
      match: '^https:\/\/vipssr\.kugou\.com\/static\/js\/vip\/newUi\/vipPageUnionIosContent-'
      policy: REJECT
  - url_regex:
      match: '^https:\/\/fx\.service\.kugou\.com\/fx\/activity\/register\/center\/sidebar\/configV2$'
      policy: REJECT
  - url_regex:
      match: '^https:\/\/service1\.fanxing\.kugou\.com\/video\/mo\/live\/pull\/mutiline\/cfg'
      policy: REJECT
  - url_regex:
      match: '^http:\/\/log\.web\.kugou\.com\/postEvent\.php$'
      policy: REJECT
  # > (广告域名)
  - domain:
      match: webvoobssdl.kugou.com
      policy: REJECT
  - domain:
      match: ad.tencentmusic.com
      policy: REJECT
  - domain:
      match: ads.service.kugou.com
      policy: REJECT
  - domain:
      match: adsfile.kugou.com
      policy: REJECT
  - domain:
      match: mdpfilebssdlbig.kugou.com
      policy: REJECT
  - domain:
      match: adserviceretry.kugou.com
      policy: REJECT
  # > (开屏广告)
  - ip_cidr:
      match: 157.255.11.247/32
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: 111.206.99.202/32
      policy: REJECT
      no_resolve: true
