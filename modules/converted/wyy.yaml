#!system= ios
#!category= 网易云音乐
#!date= 2026-11-25
name: 网易云音乐去广告
description: 全面净化 - 自定义Tab名称
icon: 'https://raw.githubusercontent.com/Keywos/rule/main/tv/app/144px/Netease.png'
dns: {}
compat_arguments:
  隐藏底部标签开关↓: '--'
  发现: '0'
  漫游: '1'
  笔记: '0'
  关注: '1'
  搜索: '1'
  首页自定义名称: '0'
  我的自定义名称: '0'
  漫游自定义名称: '0'
  笔记自定义名称: '0'
  发现自定义名称: '0'
  隐藏顶部标签开关↓: '--'
  心动: '1'
  音乐: '0'
  播客: '0'
  听书: '0'
  活动Tab: '0'
  隐藏首页卡片开关↓: '--'
  问候语: '0'
  每日推荐: '0'
  推荐歌单: '0'
  最近常听: '0'
  音乐合伙人: '0'
  雷达歌单: '1'
  排行榜: '0'
  推荐专属歌单: '0'
  你的专属歌单: '1'
  私房推荐歌曲: '1'
  红心相似歌曲: '1'
rules:
- domain:
    match: iadmusicmat.music.126.net
    policy: REJECT
- domain:
    match: iadmat.nosdn.127.net
    policy: REJECT
- domain:
    match: iadmatapk.nosdn.127.net
    policy: REJECT
- domain:
    match: httpdns.n.netease.com
    policy: REJECT
- domain:
    match: httpdns.music.163.com
    policy: REJECT
url_rewrites:
- match: ^https?:\/\/(ipv4|interface\d?)\.music\.163.com\/x?e?api\/ad
  location: http://reject-dict/
- match: ^https?:\/\/interface\d?\.music\.163\.com\/[wx]?e?api\/(?:side-bar\/mini-program\/music-service\/account|delivery\/(batch-deliver|deliver)|moment\/tab\/info\/get|yunbei\/account\/entrance\/get)
  location: http://reject-dict/
- match: ^https?:\/\/music\.163\.com\/x?eapi\/delivery\/(batch-deliver|deliver)
  location: http://reject-dict/
- match: ^https?:\/\/interface\d?\.music\.163\.com\/x?eapi\/(?:resource\/comments?\/musiciansaid|community\/friends\/fans-group\/artist\/group\/get|user\/sub\/artist|music\/songshare\/text\/recommend\/get|mine\/applet\/redpoint|resniche\/position\/play\/new\/get)
  location: http://reject-dict/
- match: ^https?:\/\/interface\d?\.music\.163.com\/[wx]?e?api\/search\/default
  location: http://reject-dict/
- match: ^https?:\/\/interface\d?\.music\.163.com\/[wx]?e?api\/(?:search\/(chart|rcmd\/keyword|specialkeyword)|resource-exposure\/|activity\/bonus\/playpage\/time\/query)
  location: http://reject-dict/
- match: ^https?:\/\/interface\d?\.music\.163.com\/x?eapi\/(?:mlivestream\/entrance\/playpage|link\/(position\/show\/strategy|scene\/show)|ios\/version|v\d\/content\/exposure\/comment\/banner)
  location: http://reject-dict/
- match: ^https?:\/\/interface\d?\.music\.163\.com\/store\/x?e?api\/(webconfig|entryconfig)
  location: http://reject-dict/
scriptings:
  # 通用接口 | 评论区、广告、红点等
  - http_response:
      name: 网易云音乐_通用
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/(batch|v\d\/resource\/comment\/floor\/get|v1\/user\/info|resource\/comments\/reply\/preload|comment\/feed\/inserted\/resources\/combined)'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
  # 免流推广弹窗清空
  - http_response:
      name: 网易云音乐_流量包
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/sp\/flow\/popup\/query'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
  # 底部 Tab (支持自定义名称)
  - http_response:
      name: 网易云音乐_Tab
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/link\/home\/framework\/tab'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
      env:
        _compat.$argument: 'FX={{{发现}}}&MY={{{漫游}}}&DT={{{笔记}}}&GZ={{{关注}}}&SOU={{{搜索}}}&SY_NAME={{{首页自定义名称}}}&WD_NAME={{{我的自定义名称}}}&MY_NAME={{{漫游自定义名称}}}&DT_NAME={{{笔记自定义名称}}}&FX_NAME={{{发现自定义名称}}}'
  # 顶部 Tab (支持自定义名称)
  - http_response:
      name: 网易云音乐_顶部Tab
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/link\/home\/framework\/top\/tab'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
      env:
        _compat.$argument: 'XD={{{心动}}}&YY={{{音乐}}}&BK={{{播客}}}&TS={{{听书}}}&HDTAB={{{活动Tab}}}'
  # 收银台广告
  - http_response:
      name: 网易云音乐_收银台
      match: '^https?:\/\/((ipv4|interface\d?)\.)?music\.163\.com\/x?e?api\/vipactivity\/app\/cashier\/setting\/get'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
  # 首页推荐 (问候语、排行榜、雷达等)
  - http_response:
      name: 网易云音乐_首页
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/(homepage\/block\/page|link\/page\/rcmd\/(resource\/show|block\/resource\/multi\/refresh))'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
      env:
        _compat.$argument: 'PRGG={{{问候语}}}&PRDRD={{{每日推荐}}}&PRSCVPT={{{推荐歌单}}}&PRST={{{最近常听}}}&HMPR={{{音乐合伙人}}}&PRRR={{{雷达歌单}}}&PRRK={{{排行榜}}}&PRMST={{{推荐专属歌单}}}&PRCN={{{你的专属歌单}}}&PRPRS={{{私房推荐歌曲}}}&PRRSS={{{红心相似歌曲}}}'
  # 发现页
  - http_response:
      name: 网易云音乐_发现
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/link\/page\/discovery\/resource\/show'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
  # 我的页横幅 / 侧边栏入口
  - http_response:
      name: 网易云音乐_我的
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/link\/position\/show\/resource'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
  # 关注列表 (显示未关注)
  - http_response:
      name: 网易云音乐_关注
      match: '^https?:\/\/(ipv4|interface\d?)\.music\.163\.com\/x?e?api\/user\/follow\/users\/mixed\/get'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
  # App 内设置页
  - http_request:
      name: 网易云音乐_设置页
      match: '^https?:\/\/music\.163\.com\/wyy-settings'
      script_url: 'https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyyad.js'
      timeout: 20
mitm:
  hostnames:
    includes:
      - music.163.com
      - interface.music.163.com
      - interface3.music.163.com
      - interface9.music.163.com
      - httpdns.n.netease.com
      - ipv4.music.163.com
compat_arguments_desc: "底部Tab: 1=隐藏, 0=显示\n自定义名称: 留空则保持原名，填写则替换显示\n顶部Tab: 0=隐藏, 1=显示 (默认只留 心动 + 推荐)\n首页卡片: 1=显示, 0=隐藏"
